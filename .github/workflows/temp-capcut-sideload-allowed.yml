name: Temp CapCut Sideload Allowed IPA

on:
  push:
    branches:
      - temp/capcut-cookie-seed-20260914
    paths:
      - '.github/workflows/temp-capcut-sideload-allowed.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-sideload-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download prior full IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: CapCutPatched-IPA
          path: source
          repository: NightVibes33/Blurr-plus-plus
          run-id: 34875893678
          github-token: ${{ github.token }}

      - name: Reconstruct clean AppAssassin bundle
        shell: bash
        run: |
          set -euo pipefail
          ls -lh source
          test -f source/CapCutPatched.ipa
          mkdir work
          cd work
          unzip -q ../source/CapCutPatched.ipa
          APP='Payload/CapCut.app'

          rm -f "$APP/Frameworks/CapCutCookieBootstrap.dylib"
          rm -f "$APP/CapCutSeedCookies.binarycookies"

          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p=Path('Payload/CapCut.app/Frameworks/BDLRepairer.framework/BDLRepairer')
          d=bytearray(p.read_bytes())
          ncmds,sizeofcmds=struct.unpack_from('<II',d,16)
          assert (ncmds,sizeofcmds)==(22,2544),(ncmds,sizeofcmds)
          struct.pack_into('<II',d,16,21,2464)
          d[2496:2576]=b'\0'*80
          p.write_bytes(d)
          h=hashlib.sha256(d).hexdigest()
          assert h=='b8b31216fb4d18511d3f216a32b723e5033a1e29a91aa54ba8e49e0da562fcbb',h
          print('Restored BDLRepairer SHA256',h)
          PY

          echo '88b4f6a9362830a3505eb3943b930d0aa6f2959e48db956524e8805642a5a839  Payload/CapCut.app/CapCut' | shasum -a 256 -c -

      - name: Patch only sideload security reporting toggles
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p=Path('Payload/CapCut.app/CapCut')
          d=p.read_bytes()
          patches=[
              (b'fbv_identify_anti_crack\x00', b'dev_identify_anti_crack\x00'),
              (b'ios_security_config\x00', b'ios_security_noopxx\x00'),
          ]
          for old,new in patches:
              assert len(old)==len(new)
              count=d.count(old)
              assert count==1,(old,count)
              d=d.replace(old,new,1)
              print(old[:-1].decode(),'->',new[:-1].decode())
          p.write_bytes(d)
          for old,new in patches:
              assert old not in d
              assert d.count(new)==1
          print('Patched main SHA256',hashlib.sha256(d).hexdigest())
          PY

          strings Payload/CapCut.app/CapCut | grep -F 'dev_identify_anti_crack'
          strings Payload/CapCut.app/CapCut | grep -F 'ios_security_noopxx'
          ! strings Payload/CapCut.app/CapCut | grep -F 'fbv_identify_anti_crack'
          ! strings Payload/CapCut.app/CapCut | grep -F 'ios_security_config'

      - name: Validate clean no-dylib bundle
        shell: bash
        run: |
          set -euo pipefail
          cd work
          test ! -e Payload/CapCut.app/Frameworks/CapCutCookieBootstrap.dylib
          test ! -e Payload/CapCut.app/CapCutSeedCookies.binarycookies
          test "$(find Payload/CapCut.app -name 'CapCutCookieBootstrap*' -print | wc -l | tr -d ' ')" = '0'
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('Payload/CapCut.app/Frameworks/BDLRepairer.framework/BDLRepairer')
          d=p.read_bytes()
          assert struct.unpack_from('<II',d,16)==(21,2464)
          assert d[2496:2576]==b'\0'*80
          print('No custom loader remains in BDLRepairer')
          PY

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work
          /usr/bin/zip -qry -1 ../CapCut_v19.4.0_SideloadTrustPatch_NoDylib.ipa Payload
          cd ..
          unzip -tq CapCut_v19.4.0_SideloadTrustPatch_NoDylib.ipa
          shasum -a 256 CapCut_v19.4.0_SideloadTrustPatch_NoDylib.ipa | tee SHA256.txt
          ls -lh CapCut_v19.4.0_SideloadTrustPatch_NoDylib.ipa

      - name: Upload full IPA
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-SideloadTrustPatch-NoDylib-IPA
          path: |
            CapCut_v19.4.0_SideloadTrustPatch_NoDylib.ipa
            SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
