name: TTKillerPlus metadata inspect

on:
  push:
    branches: [temp/ttkiller-license-free]
    paths: [.github/workflows/ttkiller-inspect.yml]

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Fetch public IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-fetch && cd browser-fetch
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install chromium >/dev/null
          cat > fetch.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs'; import path from 'path';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true});
          const page=await ctx.newPage();
          await page.goto('https://repo.ikghd.me/TTKPlus',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(3000);
          const link=page.locator('a[href*="TikTok_46.8_TTKillerPlus_2.1.ipa"]').first();
          const [dl]=await Promise.all([page.waitForEvent('download',{timeout:180000}),link.click({timeout:30000})]);
          const out=path.resolve('..','TikTok.ipa'); await dl.saveAs(out); console.log(fs.statSync(out).size); await browser.close();
          JS
          node fetch.mjs
          cd ..
          unzip -tq TikTok.ipa >/dev/null

      - name: Extract Objective-C metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir work out
          ditto -x -k TikTok.ipa work
          D="$(find work/Payload -path '*/Frameworks/TTKPlus.dylib' -type f | head -1)"
          file "$D" > out/file.txt
          otool -L "$D" > out/linked.txt || true
          nm -nm "$D" > out/nm.txt 2>&1 || true
          strings -a "$D" > out/strings.txt
          otool -ov "$D" > out/objc-meta.txt 2>&1 || true
          grep -iE -B30 -A30 'license|auth|subscr|session|expir|valid|verify|active' out/objc-meta.txt > out/auth-context.txt || true
          grep -iE 'license|auth|subscr|session|expir|valid|verify|active' out/strings.txt > out/auth-strings.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: ttkiller-objc-metadata
          path: out/
          retention-days: 3
