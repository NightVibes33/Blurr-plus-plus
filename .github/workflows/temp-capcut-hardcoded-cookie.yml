name: Temp CapCut Sideload-Tolerant Cookie IPA

on:
  push:
    branches:
      - temp/capcut-cookie-seed-20260914
    paths:
      - '.github/workflows/temp-capcut-hardcoded-cookie.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-sideload-cookie-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download hardcoded-cookie IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: CapCutPatched-HardcodedCookie-IPA
          path: source
          repository: NightVibes33/Blurr-plus-plus
          run-id: 34883757208
          github-token: ${{ github.token }}

      - name: Extract source IPA
        shell: bash
        run: |
          set -euo pipefail
          ls -lh source
          test -f source/CapCutPatched-HardcodedCookie.ipa
          rm -rf work
          mkdir work
          unzip -q source/CapCutPatched-HardcodedCookie.ipa -d work
          test -f work/Payload/CapCut.app/Frameworks/CapCutCookieBootstrap.dylib
          test ! -e work/Payload/CapCut.app/CapCutSeedCookies.binarycookies

      - name: Patch only sideload security reporting toggles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p=Path('work/Payload/CapCut.app/CapCut')
          d=p.read_bytes()
          patches=[
              (b'fbv_identify_anti_crack\x00', b'dev_identify_anti_crack\x00'),
              (b'ios_security_config\x00', b'ios_security_noopxx\x00'),
          ]
          for old,new in patches:
              assert len(old)==len(new)
              count=d.count(old)
              assert count==1,(old,count)
              d=d.replace(old,new,1)
              print(old[:-1].decode(),'->',new[:-1].decode())
          p.write_bytes(d)
          for old,new in patches:
              assert old not in d
              assert d.count(new)==1
          print('Patched main SHA256',hashlib.sha256(d).hexdigest())
          PY
          strings work/Payload/CapCut.app/CapCut | grep -F 'dev_identify_anti_crack'
          strings work/Payload/CapCut.app/CapCut | grep -F 'ios_security_noopxx'
          ! strings work/Payload/CapCut.app/CapCut | grep -F 'fbv_identify_anti_crack'
          ! strings work/Payload/CapCut.app/CapCut | grep -F 'ios_security_config'

      - name: Validate hardcoded cookie payload remains embedded
        shell: bash
        run: |
          set -euo pipefail
          APP='work/Payload/CapCut.app'
          test -f "$APP/Frameworks/CapCutCookieBootstrap.dylib"
          test ! -e "$APP/CapCutSeedCookies.binarycookies"
          strings "$APP/Frameworks/CapCutCookieBootstrap.dylib" | grep -F 'Library/Cookies'
          strings "$APP/Frameworks/CapCutCookieBootstrap.dylib" | grep -F 'Cookies.binarycookies'
          shasum -a 256 "$APP/Frameworks/CapCutCookieBootstrap.dylib" | tee dylib-SHA256.txt

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -f CapCut_v19.4.0_SideloadAllowed_HardcodedCookie.ipa
          (cd work && /usr/bin/zip -qry -1 "$GITHUB_WORKSPACE/CapCut_v19.4.0_SideloadAllowed_HardcodedCookie.ipa" Payload)
          unzip -tq CapCut_v19.4.0_SideloadAllowed_HardcodedCookie.ipa
          if unzip -l CapCut_v19.4.0_SideloadAllowed_HardcodedCookie.ipa | grep -F 'CapCutSeedCookies.binarycookies'; then
            echo 'External seed cookie unexpectedly remains in IPA' >&2
            exit 1
          fi
          shasum -a 256 CapCut_v19.4.0_SideloadAllowed_HardcodedCookie.ipa | tee IPA-SHA256.txt
          ls -lh CapCut_v19.4.0_SideloadAllowed_HardcodedCookie.ipa

      - name: Upload full IPA
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-SideloadAllowed-HardcodedCookie-IPA
          path: |
            CapCut_v19.4.0_SideloadAllowed_HardcodedCookie.ipa
            IPA-SHA256.txt
            dylib-SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
