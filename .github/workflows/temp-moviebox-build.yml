name: Temp MovieBoxPro Persistent Guest Patch

on:
  push:
    branches:
      - temp/moviebox-persistent-session
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_IPA_URL: https://www.movieboxpro.app/ipa
  EXPECTED_VERSION: "16.0"
  EXPECTED_BUNDLE_ID: com.xd.mbp31

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4

      - name: Download MovieBoxPro IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -fL --retry 3 --retry-all-errors \
            -A 'Mozilla/5.0' \
            "$SOURCE_IPA_URL" \
            -o work/MovieBoxPro.ipa
          test -s work/MovieBoxPro.ipa
          unzip -tq work/MovieBoxPro.ipa
          ls -lh work/MovieBoxPro.ipa

      - name: Extract and validate target
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/unpacked
          mkdir -p work/unpacked
          ditto -x -k work/MovieBoxPro.ipa work/unpacked

          APP_PATH="$(find work/unpacked/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          INFO="$APP_PATH/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"
          echo "Bundle: $BUNDLE_ID"
          echo "Version: $SHORT_VERSION ($BUILD_VERSION)"
          echo "Executable: $EXECUTABLE"

          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test "$SHORT_VERSION" = "$EXPECTED_VERSION"
          test -f "$APP_PATH/$EXECUTABLE"

      - name: Build persistent guest bootstrap dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p work/build

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-arc \
            patch/GuestBootstrap.m \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            '-Wl,-install_name,@executable_path/Frameworks/MBPGuestBootstrap.dylib' \
            -o work/build/MBPGuestBootstrap.dylib

          file work/build/MBPGuestBootstrap.dylib
          otool -L work/build/MBPGuestBootstrap.dylib
          test -s work/build/MBPGuestBootstrap.dylib

      - name: Inject persistent no-login bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_PATH/Frameworks"
          cp work/build/MBPGuestBootstrap.dylib "$APP_PATH/Frameworks/MBPGuestBootstrap.dylib"
          chmod 755 "$APP_PATH/Frameworks/MBPGuestBootstrap.dylib"

          python3 patch/inject_macho.py \
            "$APP_PATH" \
            '@executable_path/Frameworks/MBPGuestBootstrap.dylib'

          echo '--- injected load command ---'
          otool -L "$APP_PATH/$EXECUTABLE" | grep -F '@executable_path/Frameworks/MBPGuestBootstrap.dylib'
          test -f "$APP_PATH/Frameworks/MBPGuestBootstrap.dylib"

          # Existing signatures are intentionally left for the user's sideload signer
          # to replace. This workflow outputs an unsigned/modified IPA.

      - name: Repack patched IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work/unpacked
          ditto -c -k --sequesterRsrc --keepParent Payload ../../out/MovieBoxPro_16.0-nologin-persistent.ipa
          cd ../..

          unzip -tq out/MovieBoxPro_16.0-nologin-persistent.ipa
          shasum -a 256 out/MovieBoxPro_16.0-nologin-persistent.ipa | tee out/SHA256.txt
          ls -lh out/

      - name: Upload patched IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBoxPro-16.0-nologin-persistent
          path: |
            out/MovieBoxPro_16.0-nologin-persistent.ipa
            out/SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
