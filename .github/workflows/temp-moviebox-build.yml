name: Temp MovieBoxPro Owned Guest Build

on:
  workflow_dispatch:
    inputs:
      guest_bootstrap_url:
        description: 'HTTPS URL to your /v1/guest/bootstrap endpoint'
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_IPA_URL: https://www.movieboxpro.app/ipa
  EXPECTED_VERSION: "16.0"
  EXPECTED_BUNDLE_ID: com.xd.mbp31

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4

      - name: Download MovieBoxPro IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -fL --retry 3 --retry-all-errors -A 'Mozilla/5.0' "$SOURCE_IPA_URL" -o work/MovieBoxPro.ipa
          test -s work/MovieBoxPro.ipa
          unzip -tq work/MovieBoxPro.ipa

      - name: Extract validate and configure target
        shell: bash
        env:
          GUEST_BOOTSTRAP_URL: ${{ inputs.guest_bootstrap_url }}
        run: |
          set -euo pipefail
          case "$GUEST_BOOTSTRAP_URL" in
            https://*) ;;
            *) echo 'guest_bootstrap_url must use HTTPS' >&2; exit 2 ;;
          esac

          rm -rf work/unpacked
          mkdir -p work/unpacked
          ditto -x -k work/MovieBoxPro.ipa work/unpacked
          APP_PATH="$(find work/unpacked/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          INFO="$APP_PATH/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test "$SHORT_VERSION" = "$EXPECTED_VERSION"
          test -f "$APP_PATH/$EXECUTABLE"

          /usr/libexec/PlistBuddy -c 'Delete :MBPGuestBootstrapURL' "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MBPGuestBootstrapURL string $GUEST_BOOTSTRAP_URL" "$INFO"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"
          echo "Configured owned guest endpoint: $GUEST_BOOTSTRAP_URL"

      - name: Build owned guest bootstrap client
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p work/build
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-arc \
            patch/GuestBootstrap.m \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            '-Wl,-install_name,@executable_path/Frameworks/MBPGuestBootstrap.dylib' \
            -o work/build/MBPGuestBootstrap.dylib
          test -s work/build/MBPGuestBootstrap.dylib

      - name: Inject owned guest client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_PATH/Frameworks"
          cp work/build/MBPGuestBootstrap.dylib "$APP_PATH/Frameworks/MBPGuestBootstrap.dylib"
          chmod 755 "$APP_PATH/Frameworks/MBPGuestBootstrap.dylib"
          python3 patch/inject_macho.py "$APP_PATH" '@executable_path/Frameworks/MBPGuestBootstrap.dylib'
          otool -L "$APP_PATH/$EXECUTABLE" | grep -F '@executable_path/Frameworks/MBPGuestBootstrap.dylib'

      - name: Repack IPA
        shell: bash
        run: |
          set -euo pipefail
          cd work/unpacked
          ditto -c -k --sequesterRsrc --keepParent Payload ../../out/MovieBoxPro_16.0-owned-guest.ipa
          cd ../..
          unzip -tq out/MovieBoxPro_16.0-owned-guest.ipa
          shasum -a 256 out/MovieBoxPro_16.0-owned-guest.ipa | tee out/SHA256.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBoxPro-16.0-owned-guest
          path: |
            out/MovieBoxPro_16.0-owned-guest.ipa
            out/SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
